services:
  backend:
    build: ./backend
    container_name: backend
    network_mode: host
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
